[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-media-signed-delivery"
version = "0.1.0"
description = "A typed Python service for private creator media ingestion, processing, and expiring delivery links."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
media-delivery = "media_delivery:run"

[tool.setuptools]
py-modules = ["media_delivery", "signed_download"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

